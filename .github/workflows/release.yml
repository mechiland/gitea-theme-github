name: Build & release

# Every push / PR builds the theme and uploads a drop-in package as a workflow artifact.
# Pushing a tag v* also creates a GitHub Release with the .zip / .tar.gz attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (no literal colors, tokens only, selector ownership)
        run: npm run lint

      - name: Build theme files
        # Release tags must meet the 300 KB budget; branch builds only report it.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node build/build.mjs --strict
          else
            node build/build.mjs --budget-warn
          fi

      - name: Package for Gitea CUSTOM_PATH
        run: node build/package.mjs

      - name: Summary
        run: |
          echo "### Theme files" >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./dist/build-report.json');for(const [n,t] of Object.entries(r.themes))console.log('- theme-'+n+'.css: '+t.kb+' KB'+(t.overBudget?' (over 300 KB budget)':''))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gitea-theme-github
          path: |
            dist/gitea-theme-github-*.zip
            dist/gitea-theme-github-*.tar.gz
            dist/theme-github-*.css
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gitea-theme-github-*.zip
            dist/gitea-theme-github-*.tar.gz
          generate_release_notes: true
